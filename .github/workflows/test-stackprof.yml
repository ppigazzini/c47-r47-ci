name: Test Platform Memory Limits
# Thin CI caller for scripts/test/run-stackprof.sh. All logic lives in the
# script so it runs identically on a maintainer's machine.
#
# The lane reports every supported platform's memory limits and profiles the C
# stack of each: all four DM42 feature packages, the DM42n, and the host
# simulator. The headline it exists to publish is that the SIMULATOR CARRIES THE
# NEW HARDWARE'S MEMORY MODEL - four times the DM42's pool and a host thread's
# 8 MiB of stack against the DM42's 2,472 guaranteed bytes - so a simulator run
# cannot reproduce a DM42 memory failure.
#
# It is REPORT-ONLY here (STACKPROF_GATE unset -> 0): the per-level numbers move
# with upstream inlining, so the standing reading in the log is the deliverable.
# Set STACKPROF_GATE=1 in the env to fail on a ceiling breach.
#
# One check is hard whatever the gate says: the profiler's frame extraction is
# calibrated against gcc's own -fstack-usage output, once per instruction set,
# and an UNDER-report fails the lane. A bound below the real frame is a bound
# that permits the overflow it was meant to prevent.
#
# It builds eight trees (six shipped, two no-LTO calibration twins), which is
# what the timeout allows for. A DMCP package that no longer fits in internal
# flash is reported and skipped rather than failing the lane.

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  stackprof:
    name: Platform memory limits and C-stack profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LOG_DIR: ${{ github.workspace }}/ci-artifacts/logs
    steps:
      - uses: actions/checkout@v4
      # pyproject.toml declares requires-python >=3.14 for the repo-owned Python
      # under scripts/test/tooling/, and ruff's target-version matches it. The
      # runner image ships an older python3, so pin the interpreter here or the
      # declared floor is aspirational and a 3.14-only construct fails only in CI.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install build dependencies
        # gcc-arm-none-eabi is the cross toolchain both DMCP targets need; the
        # host GTK/GMP set is still required because Meson configures the whole
        # project graph, and the generators (ttf2RasterFonts, generateConstants)
        # are host binaries. cmake/libminizip-dev/libexpat1-dev build the xlsxio
        # tool that ttf2RasterFonts shells out to - the firmware build runs it
        # too, so it is not optional here. ccache must exist even though the
        # lane disables it: the upstream cross files name it as the compiler.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            ccache \
            cmake \
            gcc-arm-none-eabi \
            git \
            libexpat1-dev \
            libgmp-dev \
            libgtk-3-dev \
            libminizip-dev \
            libnewlib-arm-none-eabi \
            libpulse-dev \
            meson \
            ninja-build \
            pkg-config \
            python3
      - name: Cache xlsxio toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/c43/xlsxio
          key: ${{ runner.os }}-xlsxio-a9016eb2-static-tools-v1
      - name: Run platform memory profile (report-only)
        run: bash scripts/test/run-stackprof.sh
      - name: Upload stack profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-memory-profile
          path: ci-artifacts/logs/
          if-no-files-found: warn
          retention-days: 14
