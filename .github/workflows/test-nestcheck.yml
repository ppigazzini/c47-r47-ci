name: Test Nested-Engine Recursion
# Thin CI caller for scripts/test/run-nestcheck.sh. All logic lives in the
# script so it runs identically on a maintainer's machine.
#
# The lane assembles the self-referential engine-nesting probes (p47asm.py),
# builds the upstream simulator, and runs each headless, classifying
# survived/crashed/hung. It is REPORT-ONLY here (NESTCHECK_GATE unset -> 0):
# upstream master currently crashes on the SOLVE/SUM/PLOT probes, so a hard gate
# would fail every run. The lane's value in report-only mode is the standing
# count in the log - it says on every run how many self-referential nests
# upstream still cannot bound. Set NESTCHECK_GATE=1 in the env once the nesting
# budget merges to turn it into a regression gate.

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  nestcheck:
    name: Nested-engine recursion check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Put the lane's logs inside the workspace so the upload step below can
      # reach them; the script's default is under RUNNER_TEMP, which it cannot.
      LOG_DIR: ${{ github.workspace }}/ci-artifacts/logs
    steps:
      - uses: actions/checkout@v4
      # pyproject.toml declares requires-python >=3.14 for the repo-owned Python
      # under scripts/test/tooling/, and ruff's target-version matches it. The
      # runner image ships an older python3, so pin the interpreter here or the
      # declared floor is aspirational and a 3.14-only construct fails only in CI.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install build dependencies
        # The same list the UI lane uses to build the simulator, xvfb INCLUDED.
        # t47 needs a display even though it drives no keyboard: it is the same
        # GTK binary as c47 and calls gtk_init before reading its arguments, so on
        # a runner it exits 1 and the lane's control reads as a product failure.
        # cmake/libminizip-dev/libexpat1-dev are for the xlsxio toolchain
        # harness_setup_xlsxio builds; without libminizip-dev its CMake configure
        # fails on FindMinizip.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            ccache \
            cmake \
            git \
            libexpat1-dev \
            libgmp-dev \
            libgtk-3-dev \
            libminizip-dev \
            libpulse-dev \
            meson \
            ninja-build \
            pkg-config \
            xvfb
      - name: Cache xlsxio toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/c43/xlsxio
          key: ${{ runner.os }}-xlsxio-a9016eb2-static-tools-v1
      - name: Run nestcheck (report-only)
        run: bash scripts/test/run-nestcheck.sh
      # The lane's deliverable is its log, and every probe's output goes to a file
      # rather than the console. Without this the three ways it can fail - build,
      # control, probe - are all unreadable after the fact, which is how its first
      # failures went undiagnosed.
      - name: Upload nestcheck logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nestcheck-logs
          path: ci-artifacts/logs/
          if-no-files-found: warn
          retention-days: 14
